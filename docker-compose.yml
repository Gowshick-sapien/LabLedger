version: "3.8"

services:
  backend:
    build: ./backend
    container_name: labledger_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend/labledger-frontend
    container_name: labledger_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
